[package]
name = "orgasmic-drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
orgasmic-core = { path = "../orgasmic-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait = "0.1"
uuid.workspace = true
chrono.workspace = true
futures.workspace = true
libc = "0.2"
reqwest.workspace = true
tokio-tungstenite.workspace = true
tempfile = "3"
# The shared `LiveSessionGuard` lives in the normal library (`test_tooling`),
# not behind `#[cfg(test)]`, because integration
# test binaries in three crates need it. Its flock therefore needs fs2 as a
# real dependency rather than a dev-dependency.
fs2 = { workspace = true }

[dev-dependencies]
filetime = "0.2"

[lib]
path = "src/lib.rs"
