[package]
name = "orgasmic-drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
orgasmic-core = { path = "../orgasmic-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait = "0.1"
uuid.workspace = true
chrono.workspace = true
futures.workspace = true
libc = "0.2"
reqwest.workspace = true
tokio-tungstenite.workspace = true
# rmux hybrid driver (TASK-104, TASK-FG7FD): typed session control. The SDK
# starts or connects to a daemon but does NOT bundle the `rmux` binary, so the
# driver discovers/provisions that separately (RMUX_SDK_DAEMON_BINARY or PATH).
# RMUX's detached RPC protocol requires the CLI, daemon, and SDK to use the
# same release; keep this exact and mirror it in the runtime binary probe.
rmux-sdk = "=0.9.0"
tempfile = "3"
# TASK-Z3093: the one shared `LiveSessionGuard` lives in the normal library
# (`modes::rmux::test_tooling`), not behind `#[cfg(test)]`, because integration
# test binaries in three crates need it. Its flock therefore needs fs2 as a
# real dependency rather than a dev-dependency.
fs2 = { workspace = true }

[dev-dependencies]
filetime = "0.2"

[lib]
path = "src/lib.rs"
