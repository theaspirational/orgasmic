# orgasmic:TASK-WE0Q7
#
# The scheduled minutes-scale daemon soak — the only gate in this repository
# that runs a daemon for longer than about ten seconds.
#
# WHY `schedule:` AND NOT `workflow_dispatch:` ALONE
# --------------------------------------------------
# Every other nightly here is dispatch-only, driven by hand or by an external
# trigger. That is fine for a publish job: nobody forgets to publish. It is
# useless for a blindspot gate — a soak that only runs when someone remembers
# to run it is the same blindspot with extra steps (TASK-WE0Q7). So this one
# carries a real cron, and `workflow_dispatch` on top for on-demand runs.
#
# GitHub disables scheduled workflows in a repository with no activity for 60
# days and emails the owner; a repo this active will not hit that, but if the
# soak ever goes quiet for weeks, that is the first thing to check.
#
# The operator machine could run the same script from a launchd interval — the
# script is self-contained and takes no arguments — but installing a LaunchAgent
# is exactly the kind of machine-level side effect this task's own safety rules
# forbid the work from doing on its own. CI carries the schedule; the local
# option stays a deliberate operator choice.
#
# ubuntu-latest, not macOS: the class this watches (tokio timers, shutdown
# budgets, watcher loops, fd/handle accumulation) is not platform-specific, and
# a daily macOS runner costs 10x the minutes for the same signal.

name: Nightly daemon soak

on:
  schedule:
    # 09:20 UTC daily. Off the hour on purpose: GitHub's scheduler queues
    # heavily at :00 and a soak that starts late is a soak that reports late.
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: >-
          Override the soak window in seconds. Leave empty for the derived
          default (max(300s, 10x the daemon's own shutdown budget)).
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-soak
  cancel-in-progress: false

jobs:
  soak:
    name: Soak a real daemon for minutes
    runs-on: ubuntu-latest
    # Build from cold plus the derived window (>= 400s today) plus shutdown.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The gate is a shell script, so the script itself is gated too.
      - name: Shellcheck the soak
        run: shellcheck scripts/soak.sh

      - name: Soak
        env:
          # Predictable workspace root so the logs can be uploaded whatever
          # happens; the script itself picks a fresh temp dir underneath it.
          TMPDIR: ${{ runner.temp }}/soak
          DURATION: ${{ inputs.duration_seconds }}
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          if [ -n "${DURATION}" ]; then
            bash scripts/soak.sh --keep-home --duration-seconds "${DURATION}"
          else
            bash scripts/soak.sh --keep-home
          fi

      - name: Upload soak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-logs
          path: ${{ runner.temp }}/soak/orgasmic-soak.*/logs
          if-no-files-found: warn
          retention-days: 14
