# orgasmic:TASK-DJ1WV
#
# The flake registry: every failure this project is willing to see and not act
# on, written down where a machine can read it.
#
# Read by `scripts/run-tests.sh`, which reruns each failure in isolation and
# prints a REAL-vs-FLAKE verdict. Before this file existed, that classification
# was folklore — a human recalling which names were 'known', rerunning them by
# hand, and deciding. It was done from memory four times in one day, and once a
# failure was filed against the wrong owning task because one test name carried
# two different failure modes. Red that needs folklore to interpret teaches
# everyone to discount red.
#
# An entry is an excuse with an expiry, not a permanent exemption:
#
#   test       the name cargo prints. A bare function name also matches a
#              module-qualified failure, so an entry survives a test moving.
#   owner      the OPEN task that is fixing it. `--check` fails if that task is
#              done or cancelled, or is not a task at all. A registry that only
#              grows is a graveyard.
#   signature  a literal substring of the panic. This is the load-bearing
#              field: a failure of a registered NAME whose panic does not match
#              the registered SIGNATURE is reported REAL. That is the mislabel
#              detector — one test may carry two entries with two signatures and
#              two owners, and the runner will not confuse them.
#   evidence   how it was measured: what failed, what passed, when.
#   filed      the date the entry was added.
#
# Do not add an entry from memory. Every signature below is either measured in
# this repo or cited to a dated measurement recorded in `.orgasmic/tasks/`, and
# every one of them exists as a literal assertion message in the current source
# — grep it before you trust it.

# --------------------------------------------------------------------------
# TASK-X0PV1 — daemon tests that fail under full-suite parallelism, pass alone
# (owned by TASK-STWVB until 2026-08-07; transferred when that round closed with
# these modes still unfixed, rather than deleting live entries to green --check)
#
# Re-evaluated 2026-09-02 at 7c85f177 (worktree FLAKES), each of the three
# tests run 20 times as two concurrent copies of one daemon --lib binary under
# 8 cpu hogs (load average 30-56): 60/60 green. Three of the four entries that
# stood here are gone on that measurement plus a named mechanism:
#
#   recovery_reattaches_tmux_session_when_handle_exists /
#   "tmux test session should start" — the measured daemon error was `tmux
#   new-session failed (exit 1): server exited unexpectedly`, the shared-server
#   drain race. TASK-0RCRY (2026-07-29, the day AFTER the 2026-07-28
#   measurement) put every tmux-gated test on a per-process `-L` server held
#   open by a keepalive session, whose doc comment names this exact error as
#   the window it closes. The entry outlived its defect by a month.
#
#   recovery_reattaches_tmux_session_when_handle_exists / left: "interrupted"
#   — the inventory resolves attach probes against RECOVERY_ATTACH_PROBE_BUDGET
#   (1s); a `tmux has-session` that misses it classifies `interrupted` with
#   "attach proof exceeded inventory deadline" and bumps
#   attach_probes_timed_out. Same mechanism as TASK-QCG6J. The test now treats
#   exactly that shape as "liveness not decided" and returns without a verdict
#   instead of asserting a probe that never ran; a probe that ran and answered
#   "not live" still fails.
#
#   production_resume_native_fork_uses_pinned_claude_not_path_shim /
#   "resume_native_fork recover: 500" — the 500 is `supervisor_recover_error`'s
#   catch-all ("failed to recover run"), so the panic never carried the cause;
#   it is in the daemon's tracing log only. It was measured once, pre-0RCRY,
#   on a tmux-spawning path, and did not recur in 20 loaded runs here. Deleted
#   on that evidence: the next 500 must be read as REAL and its daemon log
#   read, not excused against a mechanism nobody recorded.
#
# The one below stays, re-evidenced, because its mechanism is the host and not
# the test: in the same 2026-09-02 measurement both concurrent copies of it
# stalled from 12:48:46 to 12:49:28 (41.5s and 43.4s wall for a test that
# otherwise takes 0.3s) and were released in the same second, while staying
# inside the 30s `ready` deadline — a machine-wide process-spawn stall of the
# kind the run-tests.sh host-state stamp exists to label. The registered mode
# is that stall landing on the first phase. Raising the deadline moves the
# threshold and proves nothing; the interlock is the answer.
# --------------------------------------------------------------------------

[[flake]]
test = "supervisor::tests::poll_direct_child_pid_prefers_worker_server_over_generic_sibling"
owner = "TASK-X0PV1"
signature = "fake cursor-agent did not start children"
evidence = "Manager measurement 2026-07-28 at HEAD 15997c6, full daemon --lib: 528 passed / 5 failed, this among them. Assertion is crates/orgasmic-daemon/src/supervisor.rs (the 30s `ready` deadline). Green alone 2026-07-28; NOT reproduced in 6 runs then. Re-measured 2026-09-02 at 7c85f177: 20/20 green as two concurrent copies under 8 cpu hogs, but two concurrent runs each took ~42s wall (12:48:46-12:49:28, same release second) against a 0.3s norm — a host-wide spawn stall, the same class as the registered mode."
filed = "2026-07-28"

