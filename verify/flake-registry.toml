# would file the next failure against a closed task, which is the exact mistake
# this registry was built to make impossible. Only mode 2 is registered.
# The second mode of the same test, and the first thing this registry caught.
# The full-suite run below failed on the registered NAME with an unregistered
# panic, so the runner reported it REAL rather than waving it through as the
# tmux-startup flake — which is what a human classifying from memory would have
# done. Registered afterwards, with the panic it actually produced.
[[flake]]
test = "api::tests::recovery_reattaches_tmux_session_when_handle_exists"
owner = "TASK-X0PV1"
