# --------------------------------------------------------------------------
# TASK-TZKAC — DELETED, not registered. The lock-acquisition budget was fixed.
#
# The entry that stood here named
# `api::tests::deleted_or_corrupt_claim_reconstructs_exact_status_and_post`,
# signature "the configured port is 0, so the incumbent address cannot be
# probed", filed 2026-07-29 by TASK-J1XCB and re-owned to TASK-TZKAC the same
# day. It is gone because the defect under it is gone, which is what the rule at
# the top of this file requires.
#
# The mechanism, which J1XCB left unexplained, turned out not to need the
# holder's identity at all. `acquire_daemon_lock` retried the lock only inside
# DAEMON_LOCK_RETRY_BUDGET (125ms, sized by TASK-870YX for a CLI probe that
# holds it for microseconds) and then, finding no shutdown marker, stopped
# trying the lock ENTIRELY and refused on whatever the incumbent probe could not
# establish — and every answer that probe can give short of "a healthy daemon is
# already running" is a condition the holder can grow out of a millisecond
# later. So a transient holder produced a permanent refusal, and this test could
# only ever have been fixed by acquiring the lock: `test_options()` sets
# `port_override: Some(0)`, which makes its probe permanently impossible.
#
# Fixed at the protocol level, not in the test: past the transient budget the
# loop keeps trying the lock, keeps re-reading the marker, and keeps probing, up
# to a ceiling DERIVED from this daemon's own `ShutdownBudgets::total` — so no
# holder, declared or not, can cost a replacement more wall clock than a real
# shutdown can. Proof: verify/TASK-TZKAC, whose injected red reproduces J1XCB's
# second measured refusal verbatim.
#
# The sibling this entry's comment named,
# `tests::daemon_lock_retries_a_transient_probe_hold`, is fixed by the same
# change and was never registered.
#
# Measured, this worktree, 2026-07-29. Pre-fix, carrying the pid probe J1XCB
# proposed: 28 loaded copy-runs (7 rounds x 4 concurrent copies of the daemon
# --lib binary at --test-threads=64) reproduced NEITHER test — J1XCB's own rate
# was 1 in 36, so the holder was never caught in the act and is still
# unidentified. Post-fix, same harness: 7 complete rounds, 28 copy-runs, 0
# failures of either test, and one captured instance of the new wait doing its
# job on the real path — a `Daemon::run` met an undeclared holder, waited 488ms,
# and booted, where pre-fix it would have refused. The refusal now names the pid
# the lock file records and whether it is alive, so the next sighting answers
# the question these runs could not.
# --------------------------------------------------------------------------
