# --------------------------------------------------------------------------
# TASK-TZKAC — DELETED, not registered. The lock-acquisition budget was fixed.
#
# The entry that stood here named
# `api::tests::deleted_or_corrupt_claim_reconstructs_exact_status_and_post`,
# signature "the configured port is 0, so the incumbent address cannot be
# probed", filed 2026-07-29 by TASK-J1XCB and re-owned to TASK-TZKAC the same
# day. It is gone because the defect under it is gone, which is what the rule at
# the top of this file requires.
#
# The mechanism, which J1XCB left unexplained, turned out not to need the
# holder's identity at all. `acquire_daemon_lock` retried the lock only inside
# DAEMON_LOCK_RETRY_BUDGET (125ms, sized by TASK-870YX for a CLI probe that
# holds it for microseconds) and then, finding no shutdown marker, stopped
# trying the lock ENTIRELY and refused on whatever the incumbent probe could not
# establish — and every answer that probe can give short of "a healthy daemon is
# already running" is a condition the holder can grow out of a millisecond
# later. So a transient holder produced a permanent refusal, and this test could
# only ever have been fixed by acquiring the lock: `test_options()` sets
# `port_override: Some(0)`, which makes its probe permanently impossible.
#
# Fixed at the protocol level, not in the test: past the transient budget the
# loop keeps trying the lock, keeps re-reading the marker, and keeps probing, up
# to a ceiling DERIVED from this daemon's own `ShutdownBudgets::total` — so no
# holder, declared or not, can cost a replacement more wall clock than a real
# shutdown can. Proof: verify/TASK-TZKAC, whose injected red reproduces J1XCB's
# second measured refusal verbatim.
#
# The sibling this entry's comment named,
# `tests::daemon_lock_retries_a_transient_probe_hold`, is fixed by the same
# change and was never registered.
#
# Measured, this worktree, 2026-07-29. Pre-fix, carrying the pid probe J1XCB
# proposed: 28 loaded copy-runs (7 rounds x 4 concurrent copies of the daemon
# --lib binary at --test-threads=64) reproduced NEITHER test — J1XCB's own rate
# was 1 in 36, so the holder was never caught in the act and is still
# unidentified. Post-fix, same harness: 7 complete rounds, 28 copy-runs, 0
# failures of either test, and one captured instance of the new wait doing its
# job on the real path — a `Daemon::run` met an undeclared holder, waited 488ms,
# and booted, where pre-fix it would have refused. The refusal now names the pid
# the lock file records and whether it is alive, so the next sighting answers
# the question these runs could not.
# --------------------------------------------------------------------------

# --------------------------------------------------------------------------
# TASK-37WN7 — the SIGTERM handler-installation window, still open despite the
# mitigation built for it.
#
# `serve` registers its SIGTERM handler AFTER `Daemon::run` returns, so a
# SIGTERM sent on the strength of a successful connect can land on the default
# disposition. TASK-Q07Y5 added `wait_until_serve_awaits_signals` for exactly
# this and its comment concedes the window is "invisible on an idle machine …
# under a loaded test binary it is not". This entry exists because the
# mitigation demonstrably does not close it.
#
# Registered 2026-08-05, and only once a signature was in hand. It was
# deliberately left OUT of this registry when TASK-37WN7 was filed earlier the
# same day: no panic had been captured, and a signature-less entry makes every
# future failure of this test name read as this known flake — which is the
# "trains everyone to discount failures" outcome this file exists to prevent.
#
# Measured, this worktree, 2026-08-05, on the TASK-M47E5.2 merge (b20fba5):
# full `scripts/run-tests.sh -p orgasmic-cli` red with this one failure, the
# wrapper's own isolation retry green. The manager then re-ran it alone against
# the already-built binary: 1 failure in the first 14 isolated runs and 12/12
# green immediately after. So it is NOT purely load-dependent — it reproduces
# alone at roughly 7%, which the "passes in isolation" folklore had been hiding.
# The failing assertion is `status.signal()`, i.e. the process really did die on
# the default disposition; it is not the 30s `try_wait` deadline.
#
# The signature pins that one assertion. A failure of this test on the deadline
# branch, or on the exit-code branch, is NOT this flake and must read as REAL.
#
# MECHANISM, traced 2026-08-05 at f60af0a — read this before deciding the entry
# has earned its place. `serve` prints "press Ctrl+C to stop" at main.rs:2299 and
# THEN calls `wait_for_shutdown_signal()` at :2300, which installs the SIGTERM
# handler at :2320. `wait_until_serve_awaits_signals` waits for that printed
# line. So the mitigation observes a point STRICTLY BEFORE registration — the
# wrong side of the boundary. It cannot close this window however it is
# strengthened, because at the moment the only observable signal is emitted, the
# thing it would need to observe has not happened.
#
# That is why this entry is the shortest-lived kind of excuse: the fix is to
# install the handler before announcing readiness, which is cheap and obvious
# once the ordering is seen. TASK-37WN7 owns it and its acceptance now REQUIRES
# deleting this entry in the same change. If you are reading this comment long
# after `filed`, the entry has outlived its justification — that is a finding.
[[flake]]
test = "sigterm_exits_through_graceful_shutdown_rather_than_default_disposition"
owner = "TASK-37WN7"
filed = "2026-08-05"
signature = "serve died on SIGTERM's default disposition"
evidence = "Measured 2026-08-05 on b20fba5: full orgasmic-cli suite red with this sole failure at crates/orgasmic-cli/tests/daemon_lifecycle.rs:319, `assertion left == right failed: serve died on SIGTERM's default disposition, so the graceful shutdown (release-finalization drain, writer shutdown) never ran`. Isolation retry green. Manager re-measurement: 1 failure in 14 isolated runs, then 12/12 green — so it reproduces without load at ~7%, contradicting the load-only reading. The change under test touched crates/orgasmic-cli/src/manager.rs and its tests only; daemon_lifecycle.rs and the serve path are byte-identical to base."
