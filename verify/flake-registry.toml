evidence = "Measured here 2026-07-28: full cargo test --workspace under 10 cpu hogs, 1 failure in the whole workspace, crates/orgasmic-daemon/src/api.rs:23908 assertion left == right, left 'interrupted' right 'reattached'. Green alone on the same tree. TASK-STWVB's own body records this mode: 'it is tmux session REATTACH, and it lands on interrupted rather than reattached', pointing at cross-test contention over shared tmux state."
filed = "2026-07-28"

